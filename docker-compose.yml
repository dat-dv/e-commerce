services:
  # ──────────────────────────────────────────────
  # Backend — NestJS API
  # ──────────────────────────────────────────────
  backend:
    image: datdoandev/ecommerce-backend:latest
    container_name: ecommerce-backend
    restart: unless-stopped
    ports:
      - "3000:3000"
    env_file:
      - .env.backend
    environment:
      MEILISEARCH_HOST: http://meilisearch:7700
    networks:
      - ecommerce-network
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      meilisearch:
        condition: service_started
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # ──────────────────────────────────────────────
  # Frontend — Next.js
  # ──────────────────────────────────────────────
  frontend:
    image: datdoandev/ecommerce-frontend:latest
    container_name: ecommerce-frontend
    restart: unless-stopped
    ports:
      - "5173:5173"
    env_file:
      - .env.frontend
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - ecommerce-network

  # ──────────────────────────────────────────────
  # Admin — Next.js (Static Export)
  # ──────────────────────────────────────────────
  admin:
    image: datdoandev/ecommerce-admin:latest
    container_name: ecommerce-admin
    restart: unless-stopped
    ports:
      - "5174:5174"
    env_file:
      - .env.admin
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - ecommerce-network

  # ──────────────────────────────────────────────
  # Database — PostgreSQL (Dev/Prod Switchable)
  # ──────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: ecommerce-db
    restart: unless-stopped
    ports:
      - "5432:5432"
    env_file:
      - .env.backend
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - ecommerce-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ──────────────────────────────────────────────
  # Redis
  # ──────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: ecommerce-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    env_file:
      - .env.backend
    # Truyền mật khẩu từ env nội bộ của container để tránh lỗi phân giải trống trên máy host
    command: sh -c "redis-server --requirepass $$REDIS_PASSWORD"
    volumes:
      - redis_data:/data
    networks:
      - ecommerce-network

  # ──────────────────────────────────────────────
  # Meilisearch
  # ──────────────────────────────────────────────
  meilisearch:
    image: getmeili/meilisearch:v1.13
    container_name: ecommerce-meilisearch
    restart: unless-stopped
    ports:
      - "7700:7700"
    env_file:
      - .env.backend
    environment:
      MEILI_ENV: production
    volumes:
      - meili_data:/meili_data
    networks:
      - ecommerce-network

# ──────────────────────────────────────────────
# Volumes
# ──────────────────────────────────────────────
volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  meili_data:
    driver: local

# ──────────────────────────────────────────────
# Networks
# ──────────────────────────────────────────────
networks:
  ecommerce-network:
    driver: bridge
