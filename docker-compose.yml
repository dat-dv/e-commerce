services:
  # ──────────────────────────────────────────────
  # Backend — NestJS API
  # ──────────────────────────────────────────────
  backend:
    build:
      context: . # Build context là monorepo root
      dockerfile: apps/backend/Dockerfile
    container_name: ecommerce-backend
    restart: unless-stopped
    ports:
      - "3000:3000"
    env_file:
      - .env.backend
    environment:
      DATABASE_URL: file:/app/apps/backend/prisma/data/prod.db
    volumes:
      # Persist SQLite database
      - sqlite_data:/app/apps/backend/prisma/data
    networks:
      - ecommerce-network
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s


  # ──────────────────────────────────────────────
  # Frontend — Next.js
  # ──────────────────────────────────────────────
  frontend:
    build:
      context: . # Build context là monorepo root
      dockerfile: apps/frontend/Dockerfile
    container_name: ecommerce-frontend
    restart: unless-stopped
    ports:
      - "5173:5173"
    env_file:
      - .env.frontend
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - ecommerce-network

  # ──────────────────────────────────────────────
  # Admin — Next.js (Static Export)
  # ──────────────────────────────────────────────
  admin:
    build:
      context: .
      dockerfile: apps/admin/Dockerfile
    container_name: ecommerce-admin
    restart: unless-stopped
    ports:
      - "5174:5174"
    env_file:
      - .env.admin
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - ecommerce-network

  # ──────────────────────────────────────────────
  # Database — PostgreSQL (Dev/Prod Switchable)
  # ──────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: ecommerce-db
    restart: unless-stopped
    ports:
      - "5432:5432"
    env_file:
      - .env.backend
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - ecommerce-network

# ──────────────────────────────────────────────
# Volumes
# ──────────────────────────────────────────────
volumes:
  sqlite_data:
    driver: local
  postgres_data:
    driver: local

# ──────────────────────────────────────────────
# Networks
# ──────────────────────────────────────────────
networks:
  ecommerce-network:
    driver: bridge
